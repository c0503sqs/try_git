name: Bug 报告
description: 报告一个可复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先搜索是否已有相同 issue。

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 按顺序列出可以复现问题的操作
      placeholder: |
        1. 打开...
        2. 执行...
        3. 看到...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 可以贴错误信息或截图
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 版本
      placeholder: v1.2.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - macOS
        - Windows
        - Linux
        - 其他
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已搜索过现有 issue
          required: true
        - label: 我使用的是最新版本
          required: false
