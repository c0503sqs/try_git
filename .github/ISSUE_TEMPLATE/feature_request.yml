name: 功能请求
description: 提出一个新功能或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先描述问题和场景，再描述你期望的方案。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 现在遇到了什么困难？
      placeholder: 每次导出时都要手动...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望它如何工作？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 有哪些其他做法，为什么不用？

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 命令行
        - Web 界面
        - 文档
        - 其他
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已搜索过现有 issue
          required: true
